# Configuracion base
spring.application.name=cursos-service
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH_CURSOS}
server.port=${SERVER_PORT_CURSOS}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA
spring.jpa.hibernate.ddl-auto=none
# Spring Boot 3.x: dialect autodetectado (MySQL8Dialect está deprecado).
# Naming strategy convierte camelCase de entities a snake_case en BD
# (ej: descripcionCorta -> descripcion_corta) automáticamente.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

# Hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=180000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=CursosHikariPool

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
# Cada MS usa su propia tabla de historia para no chocar con los otros
# (todos comparten la BD eduessence_dev pero NO la tabla de migraciones).
spring.flyway.table=flyway_schema_history_cursos
# El bootstrap inicial insertó las primeras migraciones con checksum=NULL.
# Flyway 10 lo trata como "applied not resolved locally" — ignoramos esa
# inconsistencia histórica para que las migraciones nuevas sí se apliquen.
spring.flyway.ignore-migration-patterns=*:missing,*:future
# Desactiva la sustitución de ${...} en los archivos SQL (no usamos esa
# feature; los ${...} en comentarios documentan placeholders Velocity).
spring.flyway.placeholder-replacement=false

# AWS
aws.region=${AWS_REGION:us-east-1}
aws.secretsmanager.secretName=${AWS_SECRETSMANAGER_SECRETNAME:}

# S3 — recursos del curso (videos presentación, PDFs programa, lecciones, grabaciones)
eduessence.aws.s3.bucket-cursos=${BUCKET_CURSOS:edu-resources-dev}
# Opcional: si se sirve por CloudFront/CDN, base URL (sin slash final)
eduessence.aws.s3.cdn-base-url=${CDN_CURSOS_BASE_URL:}

# Base URL pública del back (donde el gateway expone los endpoints públicos).
# Se usa para construir la urlPublica de archivos subidos — el browser usa
# esta URL en <img>, y el backend hace de proxy del binario de S3.
# Ejemplo dev: http://localhost:8080/cursos   prod: https://api.eduessence.com/cursos
eduessence.api.public-base-url=${PUBLIC_API_BASE_URL:http://localhost:8080/cursos}

# QR check-in para sesiones presenciales. El front genera el QR con esta URL + token.
eduessence.qr.checkin-base-url=${QR_CHECKIN_BASE_URL:https://eduessence.com/asistencia/check-in}

# Inscripción / matrícula
# Tiempo (horas) que se mantiene reservado el cupo mientras se confirma el pago.
# Debe estar alineado con eduessence.pagos.reserva-horas-default de dev-ms-pagos
# para evitar que cursos cancele la matrícula mientras pagos aún espera la llave.
app.matricula.reserva-horas=${MATRICULA_RESERVA_HORAS:24}
# Cron Spring (segundos minutos horas día-mes mes día-semana). Por defecto cada 15 min.
# Use "-" para deshabilitar (pasa a expresión inválida y el bean no se programa).
app.matricula.cron-liberar-reservas=${MATRICULA_CRON_LIBERAR:0 */15 * * * *}

# URL base del frontend — usada para armar el link "Ver curso" en las
# invitaciones de curso nuevo (broadcast al activar).
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# Broadcast de invitación al activar curso. Tamaño de lote (páginas al auth)
# y delay entre lotes para no saturar SMTP.
app.broadcast.tam-lote=${BROADCAST_TAM_LOTE:200}
app.broadcast.delay-ms=${BROADCAST_DELAY_MS:500}

# Multipart — el backend recibe el archivo y lo sube a S3 con sus credenciales
# (evita exponer credenciales al browser y problemas CORS).
#
# Configurable vía env vars para subir el límite en prod sin recompilar:
#   MULTIPART_MAX_FILE_SIZE=10GB
#   MULTIPART_MAX_REQUEST_SIZE=10GB
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:5GB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:5GB}
spring.servlet.multipart.file-size-threshold=2MB

# Tomcat: por defecto rechaza request bodies > 2MB si la app no los consume
# (maxSwallowSize). -1 = ilimitado. Necesario para uploads de video grandes.
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1

# Feign
feign.circuitbreaker.enabled=true
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

management.endpoints.web.exposure.include=health,info,metrics
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.eduessence=INFO
