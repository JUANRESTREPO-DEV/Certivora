# Configuracion base
spring.application.name=streaming-service
server.servlet.context-path=/streaming
server.port=${SERVER_PORT_STREAMING:8092}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

# Hikari — timeouts alineados con auth/cursos.
# max-lifetime debe ser MENOR que wait_timeout de MySQL RDS (default 8h) para
# que Hikari rote la conexión antes de que la server la cierre. keepalive-time
# envía un ping cada 3 min para evitar cierres por firewall/router en ambientes
# con NAT idle-timeout agresivo (ej. AWS ELB, Cloudflare tunnel).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=180000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=StreamingHikariPool

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_streaming
# El bootstrap insertó las migraciones iniciales con checksum=NULL → Flyway 10
# lo trata como "applied not resolved locally". Ignoramos esa inconsistencia
# para que las nuevas migraciones se apliquen sin tocar el historial.
spring.flyway.ignore-migration-patterns=*:missing,*:future
spring.flyway.placeholder-replacement=false

# Provider de streaming
#   MOCK        · dev local (URLs falsas, OBS no se puede conectar) — DEFAULT
#   LOCAL_RTMP  · servidor RTMP local (MediaMTX/Nginx-RTMP) — para dev real
#   AWS_IVS     · Amazon Interactive Video Service (producción)
#   NGINX_RTMP / MUX · TODO
eduessence.streaming.provider=${STREAMING_PROVIDER:MOCK}

# AWS (cuando provider=AWS_IVS)
aws.region=${AWS_REGION:us-east-1}
eduessence.aws.ivs.channel-type=${IVS_CHANNEL_TYPE:STANDARD}
eduessence.aws.ivs.latency-mode=${IVS_LATENCY_MODE:LOW}

# Servidor RTMP local (cuando provider=LOCAL_RTMP).
# Pensado para correr MediaMTX (https://github.com/bluenviron/mediamtx) o
# Nginx con módulo RTMP en tu equipo. La IP debe ser accesible desde OBS y
# desde el browser — usa tu IP de LAN, no "localhost", si OBS está en otra máquina.
eduessence.streaming.local.ingest-host=${LOCAL_RTMP_INGEST_HOST:localhost}
eduessence.streaming.local.ingest-port=${LOCAL_RTMP_INGEST_PORT:1935}
eduessence.streaming.local.ingest-path=${LOCAL_RTMP_INGEST_PATH:}
eduessence.streaming.local.playback-host=${LOCAL_RTMP_PLAYBACK_HOST:localhost}
eduessence.streaming.local.playback-port=${LOCAL_RTMP_PLAYBACK_PORT:8888}
eduessence.streaming.local.playback-scheme=${LOCAL_RTMP_PLAYBACK_SCHEME:http}

aws.secretsmanager.secretName=${AWS_SECRETSMANAGER_SECRETNAME:}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

management.endpoints.web.exposure.include=health,info,metrics
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.eduessence=INFO
