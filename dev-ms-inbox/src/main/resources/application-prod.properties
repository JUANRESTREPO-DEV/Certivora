# En prod, datasource viene de Secrets Manager (DataSourceConfig descomentado).
spring.datasource.url=${DBDATABASE}
spring.datasource.username=${RDS_USER}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

eduessence.inbox.sqs.enabled=true

logging.level.com.eduessence=INFO
logging.level.root=WARN
