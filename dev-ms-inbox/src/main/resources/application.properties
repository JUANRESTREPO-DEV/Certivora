# Configuracion base
spring.application.name=inbox-service
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH_INBOX}
server.port=${SERVER_PORT_INBOX}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

# Hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.pool-name=InboxHikariPool

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_inbox
# El bootstrap insertó las migraciones iniciales con checksum=NULL → Flyway 10
# lo trata como "applied not resolved locally". Ignoramos esa inconsistencia
# para que las nuevas migraciones se apliquen sin tocar el historial.
spring.flyway.ignore-migration-patterns=*:missing,*:future
spring.flyway.placeholder-replacement=false

# Multipart
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=45MB

# AWS
aws.region=${AWS_REGION:us-east-1}
aws.secretsmanager.secretName=${AWS_SECRETSMANAGER_SECRETNAME:}
eduessence.aws.s3.bucket-inbox-raw=${BUCKET_INBOX_RAW:eduessence-inbox-raw-dev}
eduessence.aws.s3.bucket-inbox-adjuntos=${BUCKET_INBOX_ADJUNTOS:eduessence-inbox-adjuntos-dev}

# Inbox config
eduessence.inbox.dominios-corporativos=${INBOX_DOMINIOS:eduessence.com,eduessence.co}
eduessence.inbox.forward.from-default=${INBOX_FORWARD_FROM:noreply@eduessence.com}

# SQS poller
eduessence.inbox.sqs.enabled=${INBOX_SQS_ENABLED:false}
eduessence.inbox.sqs.queue-url=${INBOX_SQS_QUEUE_URL:}

# Feign
feign.circuitbreaker.enabled=true
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

management.endpoints.web.exposure.include=health,info,metrics
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.eduessence=INFO
logging.level.software.amazon=WARN
logging.level.org.eclipse.angus=WARN
