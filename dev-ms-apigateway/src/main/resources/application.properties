# Configuracion base
spring.application.name=apigateway
server.port=${SERVER_PORT_GATEWAY}
spring.main.web-application-type=reactive

# Perfil activo (se sobreescribe con variable de entorno)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# JWT (mismo valor que dev-ms-authenticate)
eduessence.jwt.secret=${JWT_SECRET}

# CORS
eduessence.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

# Rutas publicas (sin JWT)
eduessence.security.public-paths[0]=/auth/api/auth/login
eduessence.security.public-paths[1]=/auth/api/auth/register
eduessence.security.public-paths[2]=/auth/api/auth/recuperar-password
eduessence.security.public-paths[3]=/auth/api/auth/restablecer-password
eduessence.security.public-paths[4]=/auth/api/auth/verificar-codigo
eduessence.security.public-paths[5]=/auth/internal/**
eduessence.security.public-paths[6]=/cursos/api/public/**
eduessence.security.public-paths[7]=/cursos/internal/**
eduessence.security.public-paths[8]=/pagos/internal/**
eduessence.security.public-paths[9]=/pagos/api/public/**
eduessence.security.public-paths[10]=/certificados/api/verificar/**
eduessence.security.public-paths[11]=/certificados/internal/**
eduessence.security.public-paths[12]=/eventos/api/public/**
eduessence.security.public-paths[13]=/eventos/internal/**
eduessence.security.public-paths[14]=/sendmail/internal/**
eduessence.security.public-paths[15]=/gestor-documental/internal/**
eduessence.security.public-paths[16]=/jobs/internal/**
eduessence.security.public-paths[17]=/chat/internal/**
eduessence.security.public-paths[18]=/streaming/internal/**
eduessence.security.public-paths[19]=/streaming/api/webhook/**
eduessence.security.public-paths[20]=/actuator/**
eduessence.security.public-paths[21]=/v3/api-docs/**
eduessence.security.public-paths[22]=/swagger-ui/**
eduessence.security.public-paths[23]=/webjars/**
eduessence.security.public-paths[24]=/inbox/internal/**

# Spring Cloud Gateway rutas
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

spring.cloud.gateway.routes[0].id=authenticate-service
spring.cloud.gateway.routes[0].uri=lb://AUTHENTICATE-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=cursos-service
spring.cloud.gateway.routes[1].uri=lb://CURSOS-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/cursos/**

spring.cloud.gateway.routes[2].id=pagos-service
spring.cloud.gateway.routes[2].uri=lb://PAGOS-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/pagos/**

spring.cloud.gateway.routes[3].id=certificados-service
spring.cloud.gateway.routes[3].uri=lb://CERTIFICADOS-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/certificados/**

spring.cloud.gateway.routes[4].id=eventos-service
spring.cloud.gateway.routes[4].uri=lb://EVENTOS-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/eventos/**

spring.cloud.gateway.routes[5].id=sendmail-service
spring.cloud.gateway.routes[5].uri=lb://SENDMAIL-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/sendmail/**

spring.cloud.gateway.routes[6].id=gestor-documental-service
spring.cloud.gateway.routes[6].uri=lb://GESTOR-DOCUMENTAL-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/gestor-documental/**

spring.cloud.gateway.routes[7].id=jobs-service
spring.cloud.gateway.routes[7].uri=lb://JOBS-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/jobs/**

spring.cloud.gateway.routes[8].id=chat-service
spring.cloud.gateway.routes[8].uri=lb://CHAT-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/chat/**

spring.cloud.gateway.routes[9].id=streaming-service
spring.cloud.gateway.routes[9].uri=lb://STREAMING-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/streaming/**

spring.cloud.gateway.routes[10].id=inbox-service
spring.cloud.gateway.routes[10].uri=lb://INBOX-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/inbox/**

# Circuit Breaker
resilience4j.circuitbreaker.instances.default.sliding-window-size=10
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.default.permitted-number-of-calls-in-half-open-state=3

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=when-authorized

# Jackson
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.eduessence=INFO
logging.level.reactor.netty.http.client=WARN
