# Configuracion base
spring.application.name=pagos-service
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH_PAGOS}
server.port=${SERVER_PORT_PAGOS}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

# Hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=PagosHikariPool

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_pagos
# El bootstrap insertó las migraciones iniciales con checksum=NULL → Flyway 10
# lo trata como "applied not resolved locally". Ignoramos esa inconsistencia
# para que las nuevas migraciones se apliquen sin tocar el historial.
spring.flyway.ignore-migration-patterns=*:missing,*:future
spring.flyway.placeholder-replacement=false

aws.region=${AWS_REGION:us-east-1}
aws.secretsmanager.secretName=${AWS_SECRETSMANAGER_SECRETNAME:}

feign.circuitbreaker.enabled=true
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Pasarela Wompi (futuro)
eduessence.wompi.habilitado=${WOMPI_HABILITADO:false}
eduessence.wompi.public-key=${WOMPI_PUBLIC_KEY:}
eduessence.wompi.private-key=${WOMPI_PRIVATE_KEY:}
eduessence.wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
eduessence.wompi.events-secret=${WOMPI_EVENTS_SECRET:}
eduessence.wompi.checkout-url=${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
eduessence.wompi.currency=${WOMPI_CURRENCY:COP}

# Reserva por defecto (horas).
# IMPORTANTE: debe estar alineado con app.matricula.reserva-horas en dev-ms-cursos.
# Si cursos cancela primero (porque su timeout es menor), el pago quedará
# huérfano hasta el siguiente tick de expirar-vencidos.
eduessence.pagos.reserva-horas-default=${PAGOS_RESERVA_HORAS:24}

# Job: cierra pagos PENDIENTE_LLAVE con reserva_expira < now. Cada 15 min por defecto.
app.pagos.cron-expirar-vencidos=${PAGOS_CRON_EXPIRAR:0 */15 * * * *}

# Comprobantes de transferencia: S3 + multipart.
# Por defecto reutilizamos el bucket de cursos (los comprobantes se guardan
# bajo el prefijo "pagos/{pagoId}/comprobante-..."). Para usar un bucket
# separado, define BUCKET_PAGOS=mi-bucket-aparte en el .env.
eduessence.aws.s3.bucket-pagos=${BUCKET_PAGOS:${BUCKET_CURSOS:eduessence-cursos-dev}}
eduessence.api.public-base-url=${PUBLIC_API_BASE_URL_PAGOS:http://localhost:8080/pagos}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=2MB

# Datos bancarios mostrados al usuario al iniciar transferencia manual
eduessence.pagos.banco.razon-social=${BANCO_RAZON_SOCIAL:Eduessence S.A.S}
eduessence.pagos.banco.nit=${BANCO_NIT:900.123.456-7}
eduessence.pagos.banco.banco=${BANCO_NOMBRE:Bancolombia}
eduessence.pagos.banco.tipo-cuenta=${BANCO_TIPO_CUENTA:Ahorros}
eduessence.pagos.banco.numero-cuenta=${BANCO_NUMERO_CUENTA:123-456789-01}
eduessence.pagos.banco.titular=${BANCO_TITULAR:Eduessence S.A.S}
eduessence.pagos.banco.contacto=${BANCO_CONTACTO:pagos@eduessence.com}
eduessence.pagos.banco.instrucciones=${BANCO_INSTRUCCIONES:Realiza la transferencia y sube tu comprobante. Te confirmamos por email cuando lo validemos.}

management.endpoints.web.exposure.include=health,info,metrics
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.eduessence=INFO
