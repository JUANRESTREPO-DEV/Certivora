spring.datasource.url=${DBDATABASE}
spring.datasource.username=${RDS_USER}
aws.secretsmanager.secretName=${AWS_SECRETSMANAGER_SECRETNAME}
# Sin password directa: se obtiene de AWS Secrets Manager via DataSourceConfig
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
aws.rds.iam-auth=true

logging.level.root=WARN
logging.level.com.eduessence=INFO
