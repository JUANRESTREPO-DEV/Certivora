# Configuracion base
spring.application.name=authenticate-service
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH_AUTH}
server.port=${SERVER_PORT_AUTH}

# Perfil activo (se sobreescribe con variable de entorno)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA comun
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

# HikariCP settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=180000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=AuthHikariPool

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_authenticate
# El bootstrap insertó las migraciones iniciales con checksum=NULL → Flyway 10
# lo trata como "applied not resolved locally". Ignoramos esa inconsistencia
# para que las nuevas migraciones se apliquen sin tocar el historial.
spring.flyway.ignore-migration-patterns=*:missing,*:future
spring.flyway.placeholder-replacement=false

# JWT
eduessence.jwt.secret=${JWT_SECRET}
eduessence.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
eduessence.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
eduessence.jwt.issuer=eduessence

# Configuracion AWS
aws.region=${AWS_REGION:us-east-1}
aws.secretsmanager.secretName=${AWS_SECRETSMANAGER_SECRETNAME:}

# Feign con Resilience4j
feign.circuitbreaker.enabled=true
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000
feign.client.config.default.logger-level=basic

resilience4j.circuitbreaker.instances.sendmail-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.sendmail-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sendmail-service.wait-duration-in-open-state=5s

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

logging.level.com.eduessence=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# URL base del frontend — usada para armar links de los emails (bienvenida, reset)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}
