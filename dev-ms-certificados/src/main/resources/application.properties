# Configuracion base
spring.application.name=certificados-service
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH_CERTIFICADOS}
server.port=${SERVER_PORT_CERTIFICADOS}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

# Hikari — timeouts alineados con auth/cursos.
# max-lifetime < wait_timeout de MySQL; keepalive-time evita cierres por
# firewall/router en ambientes con NAT idle-timeout agresivo.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=180000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=CertificadosHikariPool

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_certificados
# El bootstrap insertó las migraciones iniciales con checksum=NULL → Flyway 10
# lo trata como "applied not resolved locally". Ignoramos esa inconsistencia
# para que las nuevas migraciones se apliquen sin tocar el historial.
spring.flyway.ignore-migration-patterns=*:missing,*:future
spring.flyway.placeholder-replacement=false

# Multipart (subida de templates)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# AWS
aws.region=${AWS_REGION:us-east-1}
aws.secretsmanager.secretName=${AWS_SECRETSMANAGER_SECRETNAME:}
eduessence.aws.s3.bucket-certificados=${BUCKET_CERTIFICADOS:eduessence-certificados-dev}
eduessence.aws.s3.bucket-templates-diploma=${BUCKET_TEMPLATES_DIPLOMA:eduessence-templates-diploma-dev}

# Certificados
# Base URL que se incrusta en el QR del PDF. Apunta al front (no al backend)
# para que el verificador escanee → vea la página pública del front, y esa
# página detrás llame al MS-cert /api/verificar/{codigo}.
# Path canónico: /certificados/verificar/{codigo} (ya configurado en prod).
eduessence.certificados.url-verificacion-base=${CERT_URL_VERIFICACION_BASE:http://localhost:4200/certificados/verificar/}
eduessence.certificados.hash-secret=${CERT_HASH_SECRET:cambia-este-secreto-de-hash-en-prod}

# MS-cursos: base URL para descargar fondos de diploma servidos por el streamer
# del MS-cursos (template_url relativos /api/public/uploads/stream?key=...).
# En dev local apunta al gateway en :8080/cursos; en prod, al dominio público.
eduessence.cursos.public-base-url=${CURSOS_PUBLIC_BASE_URL:http://localhost:8080/cursos}

# Feign
feign.circuitbreaker.enabled=true
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

management.endpoints.web.exposure.include=health,info,metrics
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.eduessence=INFO
logging.level.com.itextpdf=WARN
logging.level.software.amazon=WARN
