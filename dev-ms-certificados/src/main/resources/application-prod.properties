# En produccion las credenciales vienen de AWS Secrets Manager via DataSourceConfig.
# Mantener el bloque @Configuration descomentado en DataSourceConfig.java cuando se
# active este perfil. Por ahora dejamos los placeholders por si se ejecuta sin Secrets.
spring.datasource.url=${DBDATABASE}
spring.datasource.username=${RDS_USER}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.com.eduessence=INFO
logging.level.root=WARN
