# Configuracion base
spring.application.name=sendmail-service
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH_SENDMAIL}
server.port=${SERVER_PORT_SENDMAIL}

# Perfil activo (se sobreescribe con variable de entorno)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA comun
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

# HikariCP settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=180000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=SendmailHikariPool

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_sendmail
# El bootstrap inicial (db/bootstrap_flyway_per_ms_v2.sql) insertó V1 y V2 con
# checksum=NULL, lo que en Flyway 10 dispara "applied migration not resolved
# locally". Esta propiedad le dice que ignore esa inconsistencia para los
# registros ya aplicados — las nuevas migraciones (V3+) sí se aplican y
# validan normalmente.
spring.flyway.ignore-migration-patterns=*:missing,*:future
# Desactiva la sustitución de ${...} en los archivos SQL. Nuestros seeds
# documentan placeholders Velocity (ej: ${nombreDestinatario}) en comentarios
# que NO deben ser reemplazados por Flyway.
spring.flyway.placeholder-replacement=false

# SMTP (eduessence.com: 465 = SSL implicito, no STARTTLS)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

# Configuracion AWS
aws.region=${AWS_REGION:us-east-1}
aws.secretsmanager.secretName=${AWS_SECRETSMANAGER_SECRETNAME:}

# S3 buckets (estilo Clinica)
eduessence.aws.region=${AWS_REGION:us-east-1}
eduessence.aws.s3.bucket-templates=${BUCKET_TEMPLATE}

# Empresa (footer / from de los emails)
eduessence.empresa.nombre=${EMPRESA_NOMBRE:Eduessence}
eduessence.empresa.correo=${EMPRESA_CORREO:contacto@eduessence.com}
eduessence.empresa.sitio-web=${EMPRESA_SITIO_WEB:https://eduessence.com}
eduessence.empresa.telefono=${EMPRESA_TELEFONO:}
eduessence.empresa.logo-url=${EMPRESA_LOGO_URL:}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

logging.level.com.eduessence=INFO
logging.level.org.apache.velocity=WARN
logging.level.software.amazon=WARN
