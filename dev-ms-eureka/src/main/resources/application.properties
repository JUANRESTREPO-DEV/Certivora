# Configuracion base
spring.application.name=eureka-server
server.port=${SERVER_PORT_EUREKA}

# Perfil activo (se sobreescribe con variable de entorno)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Eureka Server
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=15000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Jackson
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

logging.level.com.netflix.eureka=WARN
logging.level.com.netflix.discovery=WARN
